# Configuration for: https://github.com/KyleKing/copier-template-tester

[ctt]
source_directory = "app_template"

[defaults]
author_email = "ctt@ctt.ctt"
author_name = "Carl The Template"
author_username = "user_ctt"
development_branch = "main"
project_description = "Generated by copier-template-tester"
repository_provider = "https://github.com"

# Bare scaffolding, exactly what a new project starts from
[output.".ctt/default"]
project_name = "test-template"

# The same scaffolding with the htmx comments demo committed on top. `_keep_output` stops ctt
# from emptying this directory, so the template renders over the demo without deleting files it
# does not emit, and the four paths in `_skip_if_exists` let the demo keep its own routes, nav,
# home page, and README.
[output.".ctt/demo"]
_keep_output = true
project_name = "app-template-demo"
project_description = "Deno + Hono + Vento + htmx demo for app-template"
