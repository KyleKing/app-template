---
_min_copier_version: 9.0.0

# ====== TEMPLATE ======
_answers_file: .copier-answers.yml
_subdirectory: app_template
_skip_if_exists:
  - README.md
  - src/routes.ts
  - src/templates/pages/home.vto
  - src/templates/partials/nav.vto

_tasks:
  - git init

_message_after_copy: |
  The '{{ project_name }}' app has been initialized!

  1. Review the changes and commit
  2. Install tools: `mise install`
  3. Install dependencies: `deno install`
  4. Install git hooks: `hk install`
  5. Install browsers for e2e tests: `deno task test:e2e:install`
  6. Build assets and run: `mise run build && deno task dev`
  7. If this is a new project, create the GitHub repo:

      ```sh
      gh repo create "{{ project_name }}" --source=. --remote=origin --push --homepage="{{ repository_url }}"
      ```

# ====== QUESTIONS ======
development_branch:
  type: str
  help: The GitHub branch name used for development
  default: main

project_name:
  type: str
  help: Your project name (lowercase, hyphens allowed)

project_description:
  type: str
  help: Your project description

author_name:
  type: str
  help: Your full name
  default: Kyle King

author_email:
  type: str
  help: Your account email
  default: dev.act.kyle@gmail.com

repository_provider:
  type: str
  help: Your repository provider
  default: https://github.com

author_username:
  type: str
  help: Your username for {{ repository_provider }}
  default: kyleking

repository_namespace:
  type: str
  help: Your repository namespace (i.e. {{ repository_provider }}/<namespace>/{{ project_name }})
  default: "{{ author_username }}"

repository_url:
  type: str
  help: This is an internal variable where the default should be accepted.
  default: "{{ repository_provider }}/{{ repository_namespace }}/{{ project_name }}"

copyright_date:
  type: str
  help: The copyright year
  default: "{{ '%Y' | strftime }}"

# ====== INTERNAL ======
hk_version:
  type: str
  help: hk git-hooks framework version pinned in hk.pkl and mise
  default: "1.53.0"
  when: false
