[tools]
hk = "1.53.0"
pkl = "0.32.1"
python = "3.14.7"
uv = "0.12.7"

[tasks.ctt]
description = "Regenerate every case in ctt.toml under .ctt/"
run = "uvx --from copier-template-tester ctt --continue-on-error"

[tasks.ctt-default]
description = "Regenerate only .ctt/default"
run = "uvx --from copier-template-tester ctt --test-case default"

[tasks.ctt-demo]
description = "Regenerate only .ctt/demo"
run = "uvx --from copier-template-tester ctt --test-case demo"
