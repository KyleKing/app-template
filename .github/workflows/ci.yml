name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codemod:
    name: Migration codemod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: node --test scripts/migrate-to-node_test.ts

  ctt:
    name: Generated output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Regenerate .ctt/
        run: uvx --from copier-template-tester ctt --continue-on-error
      - name: Fail if generated output drifted from the template
        run: git diff --exit-code -- .ctt

  generated:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    needs: ctt
    strategy:
      fail-fast: false
      matrix:
        case: [default, demo]
    defaults:
      run:
        working-directory: .ctt/${{ matrix.case }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          working_directory: .ctt/${{ matrix.case }}

      - name: Install dependencies and build assets
        run: |
          pnpm install --frozen-lockfile
          mise run build

      - name: Run Tests
        run: pnpm test

      - name: Type Check
        run: pnpm check

      - name: Check Format
        run: pnpm fmt:check

      - name: Check Biome
        run: pnpm biome check
