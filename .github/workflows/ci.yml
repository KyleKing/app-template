name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ctt:
    name: Generated output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Regenerate .ctt/
        run: uvx --from copier-template-tester ctt --continue-on-error
      - name: Fail if generated output drifted from the template
        run: git diff --exit-code -- .ctt

  generated:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    needs: ctt
    strategy:
      fail-fast: false
      matrix:
        case: [default, demo]
    defaults:
      run:
        working-directory: .ctt/${{ matrix.case }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: .ctt/${{ matrix.case }}

      - name: Install dependencies and build assets
        run: |
          deno install
          mise run build

      - name: Run Tests
        run: deno task test

      - name: Type Check
        run: deno task check

      - name: Check Format
        run: deno task fmt --check

      - name: Check Biome
        run: deno task biome check
