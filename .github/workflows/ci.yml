name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ctt:
    name: Generated output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Regenerate .ctt/
        run: uvx --from copier-template-tester ctt --continue-on-error
      - name: Fail if generated output drifted from the template
        run: git diff --exit-code -- .ctt

  generated:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    needs: ctt
    strategy:
      fail-fast: false
      matrix:
        case: [default, demo]
    defaults:
      run:
        working-directory: .ctt/${{ matrix.case }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3

      - name: Install dependencies and build assets
        run: |
          deno install
          mise run build

      - name: Run Tests
        run: deno task test

      - name: Type Check
        run: deno task check

      - name: Check Format
        run: deno task fmt --check

      - name: Check Biome
        run: deno task biome check

      - name: Install Playwright browser for headless Chrome (fastest install)
        run: deno run --allow-all npm:playwright install chromium --only-shell
      - name: Run e2e Tests
        run: deno task test:e2e --project=chrome
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts-${{ matrix.case }}
          path: |
            .ctt/${{ matrix.case }}/playwright-report/
            .ctt/${{ matrix.case }}/test-results/
          retention-days: 1
